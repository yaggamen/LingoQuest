name: Build EPLS Stable Ver1.4.0

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unpack app source
        run: unzip -q EPLS_Ver1_4_source.zip
      - name: Compile APK
        run: cd LingoQuest_Ver1_1_Android && gradle :app:assembleDebug --no-daemon
      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: EPLS-Stable-Ver1.4.0-APK
          path: LingoQuest_Ver1_1_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
